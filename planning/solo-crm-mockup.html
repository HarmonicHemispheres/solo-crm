<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solo CRM — MagicPill Labs (mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --obsidian:#0B0E14; --ink:#0E1219; --surface:#11151C; --surface-2:#161C26; --surface-3:#1E2630;
  --border:#242D39; --border-bright:#34404F;
  --verdigris:#5BA4A4; --verdigris-dim:#46807F; --gold:#C9A84C; --butter:#E6D28A;
  --lapis:#6F9BD8; --lapis-deep:#4A6FA5;
  --papyrus:#E8E4DB; --mute:#B6B1A6; --slate:#888F9C; --faint:#5A626F;
  --green:#3FA96A; --orange:#D8A23A; --red:#D9614A;
  --font:'Inter',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --rail:230px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{background:var(--obsidian);color:var(--papyrus);font-family:var(--font);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
::selection{background:rgba(91,164,164,.3)}
button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit}
a{color:var(--verdigris);text-decoration:none}
:focus-visible{outline:2px solid var(--verdigris);outline-offset:2px;border-radius:5px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:6px;border:3px solid var(--obsidian)}

.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--verdigris)}
.mono{font-family:var(--mono)}
.meta{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.4px}
h1{font-size:27px;font-weight:700;letter-spacing:-.9px;line-height:1.1;margin:0}
h2{font-size:14.5px;font-weight:600;letter-spacing:-.1px;margin:0}

/* ── shell ───────────────────────────── */
.app{display:flex;min-height:100vh}
.rail{width:var(--rail);flex:0 0 var(--rail);background:var(--ink);border-right:1px solid var(--border);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:40}
.brand{display:flex;align-items:center;gap:10px;padding:19px 17px 16px}
.brand .mark{width:25px;height:25px;flex:0 0 25px;filter:drop-shadow(0 0 14px rgba(91,164,164,.22))}
.wordmark{width:104px;fill:currentColor;color:var(--papyrus);display:block}
.rail-app{padding:0 17px 14px;display:flex;align-items:baseline;gap:7px}
.rail-app .name{font-family:var(--mono);font-size:10.5px;letter-spacing:2.4px;text-transform:uppercase;color:var(--verdigris)}
.rail-app .ver{font-family:var(--mono);font-size:9.5px;color:var(--faint)}
.navgroup{padding:8px 11px 3px}
.navgroup .lbl{font-family:var(--mono);font-size:9px;letter-spacing:2.2px;text-transform:uppercase;color:var(--faint);padding:0 6px 7px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--mute);
  border:1px solid transparent;background:none;width:100%;text-align:left;transition:background .12s,color .12s}
.nav:hover{background:var(--surface-2);color:var(--papyrus)}
.nav.on{background:var(--surface-2);color:var(--papyrus);border-color:var(--border-bright)}
.nav .ic{width:15px;height:15px;flex:0 0 15px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.7}
.nav.on .ic{stroke:var(--verdigris);opacity:1}
.nav .count{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.rail-foot{margin-top:auto;padding:13px 17px;border-top:1px solid var(--border)}
.dbchip{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:9.5px;color:var(--faint)}
.dbchip .dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
.dbchip .dot.pulse{animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 26px;border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:30;background:rgba(11,14,20,.92);backdrop-filter:blur(10px)}
.crumb{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:1.5px;text-transform:uppercase}
.searchbtn{margin-left:auto;display:flex;align-items:center;gap:9px;background:var(--surface);
  border:1px solid var(--border);border-radius:9px;padding:7px 11px;color:var(--slate);width:clamp(180px,26vw,380px)}
.searchbtn:hover{border-color:var(--border-bright);color:var(--papyrus)}
.searchbtn .kbd{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--faint);border:1px solid var(--border);border-radius:4px;padding:1px 5px}
.btn{border-radius:9px;padding:8px 13px;font-weight:600;font-size:13px;border:1px solid transparent;
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:background .12s,border-color .12s}
.btn-prim{background:var(--verdigris);color:var(--obsidian)}
.btn-prim:hover{background:var(--verdigris-dim)}
.btn-ghost{background:var(--surface-2);color:var(--papyrus);border-color:var(--border-bright)}
.btn-ghost:hover{background:var(--surface-3)}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.iconbtn{width:26px;height:26px;border-radius:7px;background:var(--surface-2);border:1px solid var(--border);
  display:grid;place-items:center;color:var(--slate);padding:0;transition:.12s}
.iconbtn:hover{color:var(--verdigris);border-color:var(--border-bright)}
.iconbtn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round}

.view{padding:24px 26px 80px;width:100%;max-width:2100px;margin:0 auto}
.vhead{display:flex;align-items:flex-end;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.vhead .t{display:flex;align-items:center;gap:9px}
.vhead .acts{margin-left:auto;display:flex;gap:9px}
.info{width:19px;height:19px;border-radius:50%;border:1px solid var(--border-bright);background:var(--surface-2);
  color:var(--faint);font-size:10.5px;font-family:var(--mono);display:grid;place-items:center;padding:0;line-height:1}
.info:hover{color:var(--verdigris);border-color:var(--verdigris)}
.pop{position:fixed;z-index:70;max-width:320px;background:var(--surface-2);border:1px solid var(--border-bright);
  border-radius:11px;padding:13px 15px;font-size:12.5px;color:var(--mute);line-height:1.6;
  box-shadow:0 18px 44px rgba(0,0,0,.55);display:none}
.pop.open{display:block;animation:fadeUp .16s ease-out}

/* ── cards ───────────────────────────── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:13px;overflow:hidden}
.card-h{display:flex;align-items:center;gap:9px;padding:12px 15px;border-bottom:1px solid var(--border)}
.card-h .c{font-family:var(--mono);font-size:10px;color:var(--faint);background:var(--surface-3);
  border-radius:5px;padding:1px 6px}
.card-h .sp{margin-left:auto;display:flex;gap:7px;align-items:center}
.grid{display:grid;gap:14px}
.autofill{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.stats{grid-template-columns:repeat(auto-fit,minmax(185px,1fr))}

/* ── stat tiles ──────────────────────── */
.stat{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:14px 16px;position:relative;overflow:hidden}
.stat .k{font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--faint)}
.stat .v{font-size:26px;font-weight:700;letter-spacing:-1.1px;margin-top:8px;line-height:1;font-variant-numeric:tabular-nums}
.stat .spark{margin-top:9px;height:22px;display:block;width:100%}
.stat.hero{border-color:rgba(201,168,76,.4);background:radial-gradient(130% 150% at 100% 0%,rgba(201,168,76,.10),transparent 62%),var(--surface)}
.stat.hero .v{color:var(--gold)}

/* ── company mark ────────────────────── */
.cmark{border-radius:9px;display:grid;place-items:center;font-weight:700;letter-spacing:-.4px;
  border:1px solid var(--border);position:relative;overflow:hidden;flex:none}
.cmark span{position:relative;z-index:1}
.cmark::after{content:"";position:absolute;inset:0;opacity:.16;background:currentColor}

/* ── decay ring + meter ──────────────── */
.ring{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-linecap:round}
.decay{display:flex;align-items:center;gap:8px}
.decay .track{width:56px;height:4px;border-radius:2px;background:var(--surface-3);overflow:hidden}
.decay .fill{height:100%;border-radius:2px;width:0;animation:grow .6s cubic-bezier(.2,.8,.3,1) forwards}
.decay .lab{font-family:var(--mono);font-size:10.5px;color:var(--slate);white-space:nowrap}
.ok .fill{background:var(--verdigris)}
.warn .fill{background:var(--orange)} .warn .lab{color:var(--orange)}
.late .fill{background:var(--red)} .late .lab{color:var(--red)}
@keyframes grow{to{width:var(--w)}}

/* ── rows ────────────────────────────── */
.row{display:flex;align-items:center;gap:12px;padding:11px 15px;border-bottom:1px solid var(--border);
  width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;transition:background .12s}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row .grow{flex:1;min-width:0}
.row .nm{display:block;font-weight:600;font-size:13px;line-height:1.35}
.row .sub{display:block;font-size:11px;color:var(--slate);margin-top:2px;font-family:var(--mono)}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── tags ────────────────────────────── */
.tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9.5px;letter-spacing:.9px;
  text-transform:uppercase;padding:3px 7px;border-radius:5px;background:var(--surface-2);
  border:1px solid var(--border);color:var(--slate);white-space:nowrap}
.tag.verd{color:var(--verdigris);border-color:rgba(91,164,164,.32)}
.tag.gold{color:var(--gold);border-color:rgba(201,168,76,.34)}
.tag.lapis{color:var(--lapis);border-color:rgba(111,155,216,.32)}
.tag.green{color:var(--green);border-color:rgba(63,169,106,.3)}
.tag.orange{color:var(--orange);border-color:rgba(216,162,58,.3)}
.tag.red{color:var(--red);border-color:rgba(217,97,74,.3)}

/* ── company / people cards ──────────── */
.ccard{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:15px;
  text-align:left;width:100%;display:flex;flex-direction:column;gap:12px;transition:border-color .14s,transform .14s}
.ccard:hover{border-color:var(--border-bright);transform:translateY(-2px)}
.ccard .top{display:flex;align-items:center;gap:11px}
.ccard .nm{font-weight:600;font-size:14px;line-height:1.25}
.ccard .tags{display:flex;gap:6px;flex-wrap:wrap}
.ccard .foot{display:flex;align-items:center;gap:10px;padding-top:11px;border-top:1px solid var(--border)}
.ccard .foot .n{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-left:auto}

/* ── table ───────────────────────────── */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-family:var(--mono);font-size:9px;letter-spacing:1.8px;text-transform:uppercase;color:var(--faint);
  text-align:left;padding:9px 15px;border-bottom:1px solid var(--border);font-weight:400}
.tbl td{padding:11px 15px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer;transition:background .12s}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl .num{font-family:var(--mono);font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}
.valbar{height:3px;border-radius:2px;background:var(--verdigris);width:0;animation:grow .7s cubic-bezier(.2,.8,.3,1) forwards;margin-top:5px}

/* ── timeline ────────────────────────── */
.tl{padding:5px 15px 12px}
.tli{display:flex;gap:12px;padding:10px 0;position:relative}
.tli:not(:last-child)::before{content:"";position:absolute;left:11px;top:30px;bottom:-10px;width:1px;background:var(--border)}
.tli .bul{width:22px;height:22px;flex:0 0 22px;border-radius:7px;display:grid;place-items:center;
  background:var(--surface-2);border:1px solid var(--border);z-index:1}
.tli .bul svg{width:11px;height:11px;stroke:var(--verdigris);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tli .t{font-size:13px;display:block;line-height:1.4}
.tli .d{font-family:var(--mono);font-size:10px;color:var(--faint);margin-top:3px;display:block;letter-spacing:.4px}
.tli .note{font-size:12.5px;color:var(--mute);margin-top:4px;line-height:1.5}

/* ── links ───────────────────────────── */
.linkrow{display:flex;align-items:center;gap:10px;padding:9px 15px;border-bottom:1px solid var(--border);font-size:12.5px}
.linkrow:last-child{border-bottom:0}
.linkrow .src{font-family:var(--mono);font-size:9px;letter-spacing:1.3px;text-transform:uppercase;color:var(--faint);width:58px;flex:0 0 58px}
.linkrow .arrow{margin-left:auto;color:var(--faint);font-size:11px}
.linkrow:hover .arrow{color:var(--verdigris)}

/* ── pipeline ────────────────────────── */
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;align-items:start}
.col-h{display:flex;align-items:center;gap:8px;padding:0 3px 9px}
.col-h .t{font-family:var(--mono);font-size:10px;letter-spacing:1.8px;text-transform:uppercase;color:var(--slate)}
.col-h .c{font-family:var(--mono);font-size:10px;color:var(--faint);margin-left:auto}
.col-body{display:flex;flex-direction:column;gap:9px;min-height:56px;background:var(--surface-3);border-radius:11px;padding:9px}
.pcard{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px;width:100%;
  text-align:left;transition:border-color .12s,transform .12s}
.pcard:hover{border-color:var(--border-bright);transform:translateY(-1px)}
.pcard .nm{font-weight:600;font-size:12.5px;line-height:1.3;display:flex;gap:8px;align-items:center}
.pcard .v{font-family:var(--mono);font-size:11.5px;margin-top:8px;display:block}
.pcard .prob{height:3px;border-radius:2px;background:var(--surface-3);margin-top:7px;overflow:hidden}
.pcard .prob i{display:block;height:100%;background:var(--verdigris);width:0;animation:grow .7s cubic-bezier(.2,.8,.3,1) forwards}
.addcard{background:none;border:1px dashed var(--border-bright);border-radius:10px;padding:9px;color:var(--faint);
  font-family:var(--mono);font-size:10.5px;letter-spacing:1px;text-transform:uppercase}
.addcard:hover{color:var(--verdigris);border-color:var(--verdigris)}

/* ── detail ──────────────────────────── */
.back{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;letter-spacing:1.2px;
  text-transform:uppercase;color:var(--faint);background:none;border:0;padding:0;margin-bottom:14px}
.back:hover{color:var(--verdigris)}
.dhead{display:flex;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:20px}
.dmeta{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.field{display:flex;gap:12px;padding:9px 15px;border-bottom:1px solid var(--border);font-size:12.5px;align-items:center}
.field:last-child{border-bottom:0}
.field .k{font-family:var(--mono);font-size:9.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--faint);width:88px;flex:0 0 88px}
.field .v{flex:1;min-width:0}
.eng{padding:12px 15px;border-bottom:1px solid var(--border)}
.eng:last-child{border-bottom:0}
.eng-t{display:flex;align-items:center;gap:9px}
.eng-t .nm{font-weight:600;font-size:13px;flex:1;min-width:0}
.eng-t .val{font-family:var(--mono);font-size:12.5px}

/* ── modals ──────────────────────────── */
.scrim{position:fixed;inset:0;background:rgba(4,6,10,.7);backdrop-filter:blur(3px);z-index:60;
  display:none;align-items:flex-start;justify-content:center;padding:11vh 16px 16px}
.scrim.open{display:flex;animation:fade .14s ease-out}
.pal,.sheet{background:var(--surface);border:1px solid var(--border-bright);border-radius:14px;overflow:hidden;
  box-shadow:0 26px 70px rgba(0,0,0,.6);animation:fadeUp .18s cubic-bezier(.2,.8,.3,1)}
.pal{width:min(660px,94vw)}
.sheet{width:min(600px,94vw)}
.pal-in{display:flex;align-items:center;gap:11px;padding:14px 17px;border-bottom:1px solid var(--border)}
.pal-in input{flex:1;background:none;border:0;outline:none;color:var(--papyrus);font-size:15px;font-family:inherit}
.pal-in input::placeholder{color:var(--faint)}
.pal-list{max-height:46vh;overflow:auto;padding:6px}
.pal-sec{font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--faint);padding:9px 10px 4px}
.pal-i{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:9px;width:100%;background:none;border:0;text-align:left;color:var(--mute)}
.pal-i.sel{background:var(--surface-2);color:var(--papyrus)}
.pal-i .ki{font-family:var(--mono);font-size:9px;color:var(--faint);width:50px;flex:0 0 50px;letter-spacing:1px}
.pal-i .tx{flex:1;min-width:0;font-size:13.5px}
.pal-i .hint{font-family:var(--mono);font-size:10px;color:var(--faint)}
.pal-foot{display:flex;gap:15px;padding:9px 17px;border-top:1px solid var(--border);font-family:var(--mono);font-size:10px;color:var(--faint)}

.sheet-h{padding:14px 19px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sheet-b{padding:17px 19px;display:grid;gap:14px;max-height:64vh;overflow:auto}
.sheet-b .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.f-lab{font-family:var(--mono);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--faint);margin-bottom:6px;display:block}
.inp,select,textarea{width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;
  padding:9px 11px;color:var(--papyrus);font-family:inherit;font-size:13.5px;outline:none;transition:border-color .12s}
.inp:focus,select:focus,textarea:focus{border-color:var(--verdigris)}
textarea{resize:vertical;min-height:72px;line-height:1.5}
.chiprow{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:6px 10px;color:var(--slate);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;transition:.12s}
.chip.on{border-color:var(--verdigris);color:var(--verdigris);background:rgba(91,164,164,.1)}
.sheet-f{padding:13px 19px;border-top:1px solid var(--border);display:flex;gap:9px;align-items:center}
.sheet-f .note{font-family:var(--mono);font-size:10px;color:var(--faint);margin-right:auto}

/* ── new menu ────────────────────────── */
.menuwrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 7px);min-width:200px;background:var(--surface);
  border:1px solid var(--border-bright);border-radius:11px;padding:6px;z-index:50;display:none;
  box-shadow:0 18px 46px rgba(0,0,0,.55)}
.menu.open{display:block;animation:fadeUp .14s ease-out}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;
  background:none;border:0;text-align:left;color:var(--mute);font-size:13px}
.menu button:hover{background:var(--surface-2);color:var(--papyrus)}
.menu button svg{width:14px;height:14px;stroke:var(--verdigris);fill:none;stroke-width:1.7;stroke-linecap:round}
.menu button .k{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--faint)}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(18px);opacity:0;
  background:var(--surface-2);border:1px solid var(--border-bright);border-radius:10px;padding:10px 16px;
  font-size:13px;z-index:80;transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast b{color:var(--verdigris);font-weight:600}
.empty{padding:26px 15px;text-align:center;color:var(--slate);font-size:12.5px}
.empty .btn{margin-top:11px}

@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.view>*{animation:fadeUp .26s cubic-bezier(.2,.8,.3,1) both}
.view>*:nth-child(2){animation-delay:.04s}
.view>*:nth-child(3){animation-delay:.08s}
.view>*:nth-child(4){animation-delay:.12s}

/* ── progress & models ───────────────── */
.prog{display:flex;gap:3px;margin-top:8px}
.prog i{flex:1;height:4px;border-radius:2px;background:var(--surface-3);transition:background .3s}
.prog i.on{background:var(--verdigris)}
.prog i.now{background:var(--gold)}
.bar{height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;width:0;animation:grow .7s cubic-bezier(.2,.8,.3,1) forwards;background:var(--verdigris)}
.bar i.over{background:var(--red)}
.modeltag{font-family:var(--mono);font-size:9px;letter-spacing:1.2px;text-transform:uppercase;padding:2px 6px;
  border-radius:4px;border:1px solid var(--border)}
.m-retainer{color:var(--verdigris);border-color:rgba(91,164,164,.35)}
.m-fixed{color:var(--lapis);border-color:rgba(111,155,216,.35)}
.m-tm{color:var(--mute)}
.m-equity{color:var(--gold);border-color:rgba(201,168,76,.35)}

/* ── via / hierarchy ─────────────────── */
.via{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:9.5px;letter-spacing:.8px;
  text-transform:uppercase;color:var(--faint)}
.via svg{width:11px;height:11px;stroke:var(--lapis);fill:none;stroke-width:1.8;stroke-linecap:round}
.endrow{display:flex;align-items:center;gap:11px;padding:11px 15px;border-bottom:1px solid var(--border);
  width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;position:relative}
.endrow:last-child{border-bottom:0}
.endrow:hover{background:var(--surface-2)}
.endrow::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--lapis);opacity:.5}

/* ── toggles ─────────────────────────── */
.toggle{display:inline-flex;background:var(--surface-3);border-radius:9px;padding:3px;gap:2px}
.toggle button{border:0;background:none;border-radius:7px;padding:5px 11px;color:var(--slate);
  font-family:var(--mono);font-size:10px;letter-spacing:1.2px;text-transform:uppercase}
.toggle button.on{background:var(--surface);color:var(--papyrus);box-shadow:0 1px 4px rgba(0,0,0,.3)}
.legend{display:flex;gap:13px;align-items:center;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9.5px;
  letter-spacing:1px;text-transform:uppercase;color:var(--slate)}
.legend i{width:9px;height:9px;border-radius:2px;display:block}
.conc{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:10px;gap:2px}
.conc i{display:block;height:100%;border-radius:2px}

/* ── todos ───────────────────────────── */
.todo{display:flex;align-items:flex-start;gap:11px;padding:10px 15px;border-bottom:1px solid var(--border);transition:background .12s}
.todo:last-child{border-bottom:0}
.todo:hover{background:var(--surface-2)}
.check{width:17px;height:17px;flex:0 0 17px;border-radius:5px;border:1.5px solid var(--border-bright);
  background:none;padding:0;margin-top:2px;display:grid;place-items:center;transition:.15s}
.check:hover{border-color:var(--verdigris)}
.check svg{width:11px;height:11px;stroke:var(--obsidian);fill:none;stroke-width:2.6;stroke-linecap:round;
  stroke-linejoin:round;opacity:0;transition:opacity .15s}
.check.on{background:var(--verdigris);border-color:var(--verdigris)}
.check.on svg{opacity:1}
.check.wait{border-color:var(--lapis);border-style:dashed}
.todo .tx{flex:1;min-width:0;font-size:13px;line-height:1.45}
.todo.done .tx{color:var(--faint);text-decoration:line-through}
.todo .sub{display:flex;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap}
.due{font-family:var(--mono);font-size:10px;letter-spacing:.6px;white-space:nowrap}
.due.over{color:var(--red)} .due.soon{color:var(--orange)} .due.later{color:var(--faint)}
.due.wait{color:var(--lapis)}
.nextbadge{font-family:var(--mono);font-size:8.5px;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--gold);border:1px solid rgba(201,168,76,.35);border-radius:4px;padding:1px 5px}
.quickadd{display:flex;align-items:center;gap:10px;padding:10px 15px;border-top:1px solid var(--border)}
.quickadd input{flex:1;background:none;border:0;outline:none;color:var(--papyrus);font-family:inherit;font-size:13px}
.quickadd input::placeholder{color:var(--faint)}

/* ── gantt ───────────────────────────── */
.gantt{position:relative;padding:0 15px 15px}
.gmonths{display:flex;position:relative;border-bottom:1px solid var(--border);margin-bottom:9px}
.gmonths span{flex:1;font-family:var(--mono);font-size:8.5px;color:var(--faint);text-align:center;
  padding:5px 0;border-left:1px solid var(--border);letter-spacing:.5px}
.gmonths span.yr{color:var(--slate);border-left-color:var(--border-bright)}
.grow2{position:relative;height:36px;display:flex;align-items:center;margin-bottom:5px}
.gtrack{position:absolute;inset:0;pointer-events:none;background-size:calc(100%/var(--cols)) 100%;
  background-image:linear-gradient(90deg,var(--border) 1px,transparent 1px);opacity:.45}
.gbar{position:absolute;height:19px;border-radius:5px;display:flex;align-items:center;padding:0 8px;gap:7px;
  font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;cursor:pointer;
  transform-origin:left;animation:gexp .55s cubic-bezier(.2,.8,.3,1) both}
@keyframes gexp{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}
.gbar:hover{filter:brightness(1.18)}
.gbar.retainer{background:rgba(91,164,164,.24);border:1px solid var(--verdigris);color:var(--papyrus)}
.gbar.fixed{background:rgba(111,155,216,.22);border:1px solid var(--lapis);color:var(--papyrus)}
.gbar.tm{background:rgba(136,143,156,.2);border:1px solid var(--slate);color:var(--papyrus)}
.gbar.equity{background:rgba(201,168,76,.18);border:1px solid var(--gold);color:var(--papyrus)}
.gbar.ghost{opacity:.5;border-style:dashed}
.gbar.rolling::after{content:"";position:absolute;right:0;top:0;bottom:0;width:34px;
  background:linear-gradient(90deg,transparent,var(--surface))}
.gms{position:absolute;top:50%;width:6px;height:6px;border-radius:50%;transform:translate(-50%,-50%);
  background:var(--surface);border:1.5px solid currentColor}
.gms.on{background:currentColor}
.gnow{position:absolute;top:0;bottom:0;width:1px;background:var(--gold);opacity:.75;z-index:3;pointer-events:none}
.gnow::before{content:"";position:absolute;top:-3px;left:-2.5px;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.glabel{width:190px;flex:0 0 190px;padding-right:12px;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gwrap{display:flex;align-items:center}
.gplot{position:relative;flex:1;height:36px}
.ghead{display:flex}.ghead .sp{width:190px;flex:0 0 190px}

/* ── colour accents ──────────────────── */
.vicon{width:30px;height:30px;flex:0 0 30px;border-radius:9px;display:grid;place-items:center;
  background:color-mix(in srgb,var(--c) 15%,transparent);border:1px solid color-mix(in srgb,var(--c) 34%,transparent)}
.vicon svg{width:16px;height:16px;stroke:var(--c);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dbanner{height:76px;border-radius:13px;margin-bottom:-40px;
  background:linear-gradient(115deg,color-mix(in srgb,var(--c) 26%,transparent),transparent 62%),
             linear-gradient(180deg,var(--surface-2),transparent);
  border:1px solid var(--border);border-bottom:0;position:relative;overflow:hidden}
.dbanner::after{content:"";position:absolute;inset:0;
  background:radial-gradient(60% 120% at 88% 0%,color-mix(in srgb,var(--c) 16%,transparent),transparent 70%)}
.dhead{position:relative;z-index:1;padding:0 4px}

/* ── links ───────────────────────────── */
.lrow{display:flex;align-items:center;gap:11px;padding:9px 15px;border-bottom:1px solid var(--border);
  color:var(--papyrus);transition:background .12s}
.lrow:last-of-type{border-bottom:0}
.lrow:hover{background:var(--surface-2)}
.favi{flex:none;border-radius:4px}
.lrow .arrow{color:var(--faint);font-size:11px}
.lrow:hover .arrow{color:var(--verdigris)}

/* ── services ────────────────────────── */
.scard{background:var(--surface);border:1px solid var(--border);border-radius:13px;overflow:hidden;
  transition:border-color .14s,transform .14s}
.scard:hover{border-color:var(--border-bright);transform:translateY(-2px)}
.sband{height:3px;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 20%,transparent))}
.price{font-family:var(--mono);font-size:13.5px;color:var(--c);white-space:nowrap;font-weight:500}
.vertrack{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}
.vertag{display:inline-flex;flex-direction:column;gap:1px;font-family:var(--mono);font-size:10px;
  padding:4px 8px;border-radius:6px;border:1px solid var(--border);background:var(--surface-2);color:var(--slate)}
.vertag.now{border-color:color-mix(in srgb,var(--c) 45%,transparent);color:var(--papyrus)}
.vertag.old{opacity:.6;text-decoration:line-through;text-decoration-color:var(--faint)}

/* ── offerings ───────────────────────── */
.catblock{margin-bottom:22px}
.cathead{display:flex;align-items:center;gap:10px;padding:0 3px 9px}
.catdot{width:9px;height:9px;border-radius:3px;background:var(--c);flex:none;box-shadow:0 0 12px var(--c)}
.catname{font-weight:600;font-size:14px;letter-spacing:-.2px}
.catacts{margin-left:auto;display:flex;gap:6px;opacity:0;transition:opacity .14s}
.catblock:hover .catacts{opacity:1}
.srow{display:flex;align-items:center;gap:12px;padding:12px 15px;border-bottom:1px solid var(--border);
  flex-wrap:wrap;position:relative;transition:background .12s}
.srow:last-of-type{border-bottom:0}
.srow:hover{background:var(--surface-2)}
.sdot{width:3px;align-self:stretch;border-radius:2px;background:var(--c);flex:none;opacity:.65}
.snm{display:block;font-weight:600;font-size:13.5px;line-height:1.3}
.sblurb{display:block;font-size:11.5px;color:var(--slate);margin-top:2px}
.sprice{font-family:var(--mono);font-size:13.5px;color:var(--c);white-space:nowrap;font-weight:500;text-align:right}
.sacts{display:flex;gap:5px;opacity:0;transition:opacity .14s}
.srow:hover .sacts,.srow:focus-within .sacts{opacity:1}
@media (max-width:700px){.sacts{opacity:1}}

/* ── workspace ───────────────────────── */
.setrow{display:flex;align-items:center;gap:14px;padding:11px 15px;border-bottom:1px solid var(--border)}
.setrow:last-of-type{border-bottom:0}
.switch{width:38px;height:21px;border-radius:11px;background:var(--surface-3);border:1px solid var(--border);
  padding:0;position:relative;flex:none;transition:background .16s,border-color .16s}
.switch span{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;
  background:var(--slate);transition:transform .16s,background .16s}
.switch.on{background:rgba(91,164,164,.28);border-color:var(--verdigris)}
.switch.on span{transform:translateX(17px);background:var(--verdigris)}
.steps{display:flex;gap:3px}
.stepb{border:1px solid var(--border);background:var(--surface-2);border-radius:6px;padding:3px 8px;
  font-family:var(--mono);font-size:10.5px;color:var(--slate)}
.stepb.on{border-color:var(--verdigris);color:var(--verdigris);background:rgba(91,164,164,.1)}
.kbdx{font-family:var(--mono);font-size:10px;border:1px solid var(--border);border-radius:4px;
  padding:1px 6px;color:var(--mute);background:var(--surface-2)}
.tblbar{width:56px;height:4px;border-radius:2px;background:var(--surface-3);overflow:hidden;flex:none}
.tblbar i{display:block;height:100%;background:var(--verdigris);width:0;animation:grow .6s cubic-bezier(.2,.8,.3,1) forwards}
.sqlbox{width:100%;min-height:112px;background:var(--obsidian);border:1px solid var(--border);border-radius:9px;
  padding:11px 13px;color:var(--papyrus);font-family:var(--mono);font-size:12.5px;line-height:1.65;outline:none;resize:vertical}
.sqlbox:focus{border-color:var(--verdigris)}
.sqlmeta{font-family:var(--mono);font-size:10px;color:var(--faint);padding:0 15px 8px;letter-spacing:.6px}
.sqlerr{margin:0 15px 15px;padding:11px 13px;border-radius:9px;background:rgba(217,97,74,.09);
  border:1px solid rgba(217,97,74,.34);color:var(--red);font-family:var(--mono);font-size:12px;line-height:1.55}
.sqlout{max-height:340px;overflow:auto;border-top:1px solid var(--border)}
.sqlout th{position:sticky;top:0;background:var(--surface);z-index:1}
.sqlout tbody tr{cursor:default}
.vtog button{padding:5px 9px;display:grid;place-items:center}
.vtog svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round}

.menutoggle{display:none}
@media (max-width:900px){
  .rail{position:fixed;left:-250px;transition:left .2s}
  .rail.open{left:0}
  .menutoggle{display:grid}
  .view{padding:18px 14px 70px}
  .topbar{padding:11px 14px}
  .searchbtn{width:auto;flex:1}
  .searchbtn span.lbl{display:none}
  .sheet-b .two{grid-template-columns:1fr}
  .crumb{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}
  .decay .fill,.valbar,.pcard .prob i{width:var(--w)!important}}
</style>
</head>

function linkKind(url){
  const u=url.toLowerCase();
  if(u.includes('drive.google')||u.includes('docs.google'))return'drive';
  if(u.includes('notion.'))return'notion';
  if(u.includes('github.'))return'github';
  if(u.includes('figma.'))return'figma';
  if(u.includes('stripe.'))return'stripe';
  if(u.endsWith('.pdf'))return'pdf';
  if(u.includes('slack.'))return'slack';
  return'web';
}

function dueInfo(t){
  if(t.status==='waiting'){const d=days(t.since);return{cls:'wait',label:'waiting '+d+'d',sort:1e6+d};}
  if(!t.due)return{cls:'later',label:'no date',sort:1e7};
  const d=days(t.due);
  return {cls:d>0?'over':d===0?'soon':d>=-7?'soon':'later',
    label:d>0?d+'d overdue':d===0?'today':d===-1?'tomorrow':fmtDate(t.due),sort:-d};
}
function bucket(t){
  if(t.status==='waiting')return'Waiting on someone else';

}

function runSql(raw){
  const t0=performance.now();
  const q=raw.trim().replace(/;$/,'');
  if(!/^select\b/i.test(q))return{err:'Read-only console — SELECT statements only.'};
  const m=q.match(/^select\s+(.+?)\s+from\s+(\w+)(?:\s+where\s+(.+?))?(?:\s+order\s+by\s+([\w.]+)(?:\s+(asc|desc))?)?(?:\s+limit\s+(\d+))?$/is);
  if(!m)return{err:'Could not parse. Shape: SELECT cols FROM table [WHERE ...] [ORDER BY col] [LIMIT n]'};
  const [,cols,table,where,ord,dir,lim]=m;
  if(!TABLES[table])return{err:`No table "${table}". Try: ${Object.keys(TABLES).join(', ')}`};
  let rows=TABLES[table]();
  if(where){
    const parts=where.split(/\s+(and|or)\s+/i);
    try{
      rows=rows.filter(r=>{
        let acc=cond(r,parts[0]);
        for(let i=1;i<parts.length;i+=2){
          const op=parts[i].toLowerCase(), v=cond(r,parts[i+1]);
          acc=op==='and'?(acc&&v):(acc||v);
        }
        return acc;});
    }catch(e){return{err:e.message};}
  }
  if(ord)rows=[...rows].sort((a,b)=>{const x=a[ord],y=b[ord];
    const c=(x==null?-1:y==null?1:x>y?1:x<y?-1:0);return (dir||'asc').toLowerCase()==='desc'?-c:c;});
  if(/count\(\s*\*\s*\)/i.test(cols))return{cols:['count'],rows:[{count:rows.length}],ms:performance.now()-t0};
  if(lim)rows=rows.slice(0,+lim);
  let out=rows, keys=rows.length?Object.keys(rows[0]):[];
  if(cols.trim()!=='*'){
    keys=cols.split(',').map(s=>s.trim());
    const bad=keys.find(k=>rows.length&&!(k in rows[0]));
    if(bad)return{err:`No column "${bad}" on ${table}. Columns: ${Object.keys(rows[0]).join(', ')}`};
    out=rows.map(r=>Object.fromEntries(keys.map(k=>[k,r[k]])));
  }
  return{cols:keys,rows:out,ms:performance.now()-t0};
}
function cond(r,expr){
  const m=expr.trim().match(/^([\w.]+)\s*(=|!=|<>|>=|<=|>|<|like|is not|is)\s*(.+)$/i);
  if(!m)throw new Error(`Bad condition: ${expr}`);
  let [,k,op,v]=m; op=op.toLowerCase();
  v=v.trim().replace(/^['"]|['"]$/g,'');
  let a=r[k];
  if(op==='is')return v.toLowerCase()==='null'?a==null:a==v;
  if(op==='is not')return v.toLowerCase()==='null'?a!=null:a!=v;
  if(op==='like')return a!=null&&new RegExp('^'+String(v).replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/%/g,'.*')+'$','i').test(String(a));
  if(v==='null')v=null;
  else if(v==='true')v=true; else if(v==='false')v=false;
  else if(/^-?\d+(\.\d+)?$/.test(v))v=+v;
  switch(op){case'=':return a==v;case'!=':case'<>':return a!=v;
    case'>':return a>v;case'<':return a<v;case'>=':return a>=v;case'<=':return a<=v;}
  return false;
}

const MODEL={retainer:'Retainer',fixed:'Fixed',tm:'T&M',equity:'Equity',none:'—'};
const mrr=e=>e.model==='retainer'&&e.status==='Active'?e.rate:0;
const runRate=e=>e.model==='tm'&&e.status==='Active'?e.hourly*e.hoursUsed:0;
const backlog=e=>e.model==='fixed'&&e.status==='Active'?e.value*(1-e.done/e.total):0;
function headline(e){
  if(e.model==='retainer')return money(e.rate)+' / mo';
  if(e.model==='fixed')return money(e.value);
  if(e.model==='tm')return money(e.hourly)+' / hr';
  return e.note||'—';
}
const effRate=e=>{
  if(!e.hoursLogged)return'';
  const earned=e.model==='fixed'?e.value*(e.done/e.total):e.model==='retainer'?e.rate*e.months:e.hourly*e.hoursLogged;
  const r=Math.round(earned/e.hoursLogged);
  const cls=r<120?'var(--red)':r<160?'var(--orange)':'var(--verdigris)';
  return ` · <span style="color:${cls}">${money(r)}/hr effective</span> · ${e.hoursLogged}h logged`;};

function progress(e){
  if(e.model==='retainer'){
    const pct=e.hoursUsed/e.hoursIncl, over=pct>1;
    return `<div class="bar"><i style="--w:${Math.min(pct,1)*100}%" class="${over?'over':''}"></i></div>
      <div class="meta" style="margin-top:6px">${e.hoursUsed} of ${e.hoursIncl} hrs this month${over?' · over':''} · month ${e.months}</div>`;
  }
  if(e.model==='fixed'){
    return `<div class="prog">${e.milestones.map((m,i)=>`<i class="${i<e.done?'on':i===e.done&&e.status==='Active'?'now':''}" title="${esc(m)}"></i>`).join('')}</div>

  }
  if(e.model==='tm'){
    const pct=e.hoursUsed/e.hoursEst;
    return `<div class="bar"><i style="--w:${Math.min(pct,1)*100}%"></i></div>
      <div class="meta" style="margin-top:6px">${e.hoursUsed} of ~${e.hoursEst} hrs · ${money(e.hourly*e.hoursUsed)} this month</div>`;
  }
  return '';
}

function decay(c){

  return {d,pct,cls:pct>=1?'late':pct>=.7?'warn':'ok',label:d===0?'today':d+'d',
    html:`<span class="decay ${pct>=1?'late':pct>=.7?'warn':'ok'}"><span class="track"><span class="fill" style="--w:${Math.min(pct,1)*100}%"></span></span><span class="lab">${d===0?'today':d+'d'}</span></span>`};
}

function ring(pct,size,color){
  const r=size/2-3,C=2*Math.PI*r;
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="var(--surface-3)" stroke-width="4"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-width="4" stroke-dasharray="${C}"
      stroke-dashoffset="${C*(1-Math.min(pct,1))}" style="transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.3,1)"/></svg>`;
}
function sparkline(vals,color){
  const max=Math.max(...vals)||1;
  const pts=vals.map((v,i)=>`${i/(vals.length-1)*100},${20-v/max*18}`).join(' ');
  return `<svg class="spark" viewBox="0 0 100 22" preserveAspectRatio="none">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"
    stroke-dasharray="200" stroke-dashoffset="200"><animate attributeName="stroke-dashoffset" to="0" dur="1s" fill="freeze"/></polyline></svg>`;
}
function stackChart(h){
  const max=20,w=100/revMonths.length,H=h||160;
  return `<svg viewBox="0 0 100 42" preserveAspectRatio="none" style="width:100%;height:${H}px;display:block">

      const segs=[[r[1],'var(--verdigris)'],[r[2],'var(--lapis)'],[r[3],'var(--verdigris-dim)']];
      let y=38.4; return segs.map(([v,c],j)=>{ if(!v)return'';
        const hh=v/max*34; y-=hh;
        return `<rect x="${i*w+w*.17}" y="${y}" width="${w*.66}" height="${hh}" rx=".5" fill="${c}" opacity="${r[4]?.42:.92}">
          <animate attributeName="height" from="0" to="${hh}" dur=".6s" fill="freeze" begin="${i*.035}s"/>
          <animate attributeName="y" from="38.4" to="${y}" dur=".6s" fill="freeze" begin="${i*.035}s"/></rect>`;}).join('');
    }).join('')}
    <line x1="0" y1="38.6" x2="100" y2="38.6" stroke="var(--border)" stroke-width=".3"/>
    <line x1="${12/revMonths.length*100}" y1="0" x2="${12/revMonths.length*100}" y2="38.6" stroke="var(--border-bright)" stroke-width=".25" stroke-dasharray="1 1"/></svg>

}

/* ── engagement timeline ── */
const GT0=new Date('2025-09-01'), GT1=new Date('2027-03-01');
const gpos=d=>Math.max(0,Math.min(100,(new Date(d)-GT0)/(GT1-GT0)*100));
function ganttMonths(){
  const out=[];let d=new Date(GT0);
  while(d<GT1){const m=d.getMonth();
    out.push(`<span class="${m===0?'yr':''}">${m===0?"'"+String(d.getFullYear()).slice(2):'JFMAMJJASOND'[m]}</span>`);
    d=new Date(d.getFullYear(),m+1,1);}
  return out;
}
function ganttRow(e){
  const s=gpos(e.start), en=e.end?gpos(e.end):100, w=Math.max(en-s,1.2);
  const rolling=!e.end, ghost=e.status==='Proposed'||e.status==='Pending';
  const ms=e.model==='fixed'&&e.milestones?e.milestones.map((m,i)=>{
    const p=(i+1)/e.total*100;
    return `<span class="gms ${i<e.done?'on':''}" style="left:${p}%" title="${esc(m)}"></span>`;}).join(''):'';
  return `<div class="gwrap"><div class="glabel" title="${esc(e.name)}">${esc(e.name)}</div>
    <div class="gplot"><div class="gtrack" style="--cols:18"></div>
      <div class="gbar ${e.model} ${rolling?'rolling':''} ${ghost?'ghost':''}"
        style="left:${s}%;width:${w}%;animation-delay:${Math.random()*.2}s" onclick="go('company','${e.biller}')"
        title="${esc(e.name)} · ${e.start} → ${e.end||'rolling'}">
        <span style="overflow:hidden;text-overflow:ellipsis">${headline(e)}</span>${ms}</div>
      <div class="gnow" style="left:${gpos('2026-08-27')}%"></div></div></div>`;
}
function ganttView(){
  const groups={};
  engagements.forEach(e=>{(groups[e.biller]=groups[e.biller]||[]).push(e);});
  return `<div class="card">
    <div class="card-h"><h2>Timeline</h2><span class="sp"><span class="legend">
      <span><i style="background:var(--verdigris)"></i>retainer</span><span><i style="background:var(--lapis)"></i>fixed</span>
      <span><i style="background:var(--slate)"></i>T&amp;M</span><span><i style="background:var(--gold)"></i>equity</span>
      <span style="opacity:.6">dashed = not signed</span></span></span></div>
    <div class="gantt">
      <div class="ghead"><div class="sp"></div><div class="gmonths" style="flex:1">${ganttMonths().join('')}</div></div>
      ${Object.entries(groups).map(([id,es])=>`
        <div style="display:flex;align-items:center;gap:9px;padding:11px 0 5px">${mark(co(id).name,22)}
          <span style="font-weight:600;font-size:12.5px">${esc(co(id).name)}</span>
          <span class="meta">${es.length}</span></div>
        ${es.sort((a,b)=>a.start<b.start?-1:1).map(ganttRow).join('')}`).join('')}
    </div></div>`;
}

  const raw=ev.target.value.trim();

  const name=(m?m[1]:raw).trim(), rate=m?+m[2].replace(/,/g,''):0;
  const unit=m&&m[4]?m[4].toLowerCase():'fixed';
  services.push({id:'s'+Date.now(),name,type:catOf(catId).name.toLowerCase().includes('product')?'product':'service',
    cat:catId,model:unit==='mo'?'retainer':unit==='hr'?'tm':'fixed',unit,active:true,blurb:'',
    versions:[{v:1,rate,from:'2026-08-27',to:null}]});
  ev.target.value='';refreshCounts();toast(`<b>${esc(name)}</b> added`);go('services');
}

function go(v,arg){
  cur=v;curArg=arg;
  $('#view').innerHTML=views[v]?views[v](arg):'<div class="empty">Nothing here.</div>';
  const crumbs={today:'Today',companies:'Companies',company:'Companies /',people:'People',person:'People /',
    engagements:'Engagements',pipeline:'Pipeline',activity:'Activity',revenue:'Revenue',todos:'Todos',services:'Offerings',settings:'Workspace',data:'Workspace / Data'};
  $('#crumb').textContent=crumbs[v]||v;

}

function countUp(){
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('[data-count]').forEach(el=>{
    const target=parseFloat(el.dataset.count),dec=el.dataset.count.includes('.')?1:0;
    const fmt=v=>(el.dataset.pre||'')+(el.dataset.comma?Math.round(v).toLocaleString():v.toFixed(dec))+(el.dataset.post||'');
    if(reduce){el.textContent=fmt(target);return;}
    const t0=performance.now();
    const step=t=>{const p=Math.min((t-t0)/650,1),e=1-Math.pow(1-p,3);
      el.textContent=fmt(target*e); if(p<1)requestAnimationFrame(step);};
    requestAnimationFrame(step);
  });
}

    <div><label class="f-lab">Relationship</label><div class="chiprow" data-chip="kind">
      ${['Client','Prospect','End client','Advisory','Channel'].map((k,i)=>`<button class="chip ${i===0?'on':''}" data-v="${k}">${k}</button>`).join('')}</div></div>
    <div><label class="f-lab">Who invoices</label><div class="chiprow" data-chip="bills">
      <button class="chip on" data-v="direct">They pay me directly</button>
      <button class="chip" data-v="via">Billed through a partner</button></div></div>
    <div id="viaWrap" style="display:none"><label class="f-lab">Billing partner</label>
      <select class="inp" id="f_via">${coOpts(c=>c.bills)}</select></div>
    <div class="two">
      <div><label class="f-lab">Website</label><input class="inp" id="f_site" placeholder="acme.com"></div>
      <div><label class="f-lab">Budget</label><input class="inp" id="f_budget" placeholder="$25,000 approved"></div>
    </div>
    <div><label class="f-lab">Reach out every</label><div class="chiprow" data-chip="cadence">
      ${[7,14,30,90].map((d,i)=>`<button class="chip ${i===0?'on':''}" data-v="${d}">${d} days</button>`).join('')}</div></div>`},
  person:{title:'New person',note:'INSERT INTO people + affiliations',fields:`
    <div class="two">
      <div><label class="f-lab">Name</label><input class="inp" id="f_name" placeholder="Jane Doe"></div>
      <div><label class="f-lab">Email</label><input class="inp" id="f_email" placeholder="jane@acme.com"></div></div>
    <div><label class="f-lab">Role</label><input class="inp" id="f_title" placeholder="Head of operations"></div>
    <div><label class="f-lab">Company</label><select class="inp" id="f_co"><option value="">— none —</option>${coOpts()}</select></div>
    <div><label class="f-lab">Tag</label><div class="chiprow" data-chip="tag">
      ${['Decision maker','Prospect','Referral source','Bench','Back office','Advisor'].map((t,i)=>`<button class="chip ${i===0?'on':''}" data-v="${t}">${t}</button>`).join('')}</div></div>`},
  service:{title:'New item',note:'INSERT INTO services + service_versions',fields:`
    <div><label class="f-lab">Name</label><input class="inp" id="f_name" placeholder="Discovery Audit"></div>
    <div class="two">
      <div><label class="f-lab">Kind</label><div class="chiprow" data-chip="stype">
        <button class="chip on" data-v="service">Service</button><button class="chip" data-v="product">Product</button></div></div>
      <div><label class="f-lab">Category</label><select class="inp" id="f_cat">
        ${categories.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div></div>
    <div><label class="f-lab">Priced as</label><div class="chiprow" data-chip="sunit">
      ${[['fixed','Flat'],['from','From'],['mo','Per month'],['hr','Per hour']].map(([v,l],i)=>`<button class="chip ${i===0?'on':''}" data-v="${v}">${l}</button>`).join('')}</div></div>
    <div class="two"><div><label class="f-lab">List price</label><input class="inp" id="f_rate" placeholder="4500"></div>
      <div><label class="f-lab">Effective from</label><input class="inp" id="f_from" type="date" value="2026-09-01"></div></div>
    <div><label class="f-lab">One line</label><input class="inp" id="f_blurb" placeholder="What the client gets."></div>
    <div class="meta">Later price changes add a new version. Signed engagements keep the rate they were sold at.</div>`},
  todo:{title:'New todo',note:'INSERT INTO tasks',fields:`
    <div><label class="f-lab">What needs doing</label><input class="inp" id="f_name" placeholder="Send the countersigned SOW"></div>
    <div class="two">
      <div><label class="f-lab">Company</label><select class="inp" id="f_co"><option value="">— none —</option>${coOpts()}</select></div>
      <div><label class="f-lab">Due</label><input class="inp" id="f_due" type="date"></div></div>
    <div><label class="f-lab">State</label><div class="chiprow" data-chip="state">
      <button class="chip on" data-v="todo">My move</button><button class="chip" data-v="waiting">Waiting on them</button></div></div>
    <div><label class="f-lab">Mark as</label><div class="chiprow" data-chip="next">
      <button class="chip on" data-v="0">Ordinary todo</button><button class="chip" data-v="1">The next step for this relationship</button></div></div>`},
  engagement:{title:'New engagement',note:'INSERT INTO engagements',fields:`
    <div><label class="f-lab">Name</label><input class="inp" id="f_name" placeholder="Fixed scope SOW"></div>
    <div class="two">
      <div><label class="f-lab">Billed to</label><select class="inp" id="f_biller" onchange="syncClient()">${coOpts(c=>c.bills)}</select></div>
      <div><label class="f-lab">Work is for</label><select class="inp" id="f_client">${coOpts()}</select></div></div>
    <div><label class="f-lab">Billing model</label><div class="chiprow" data-chip="model" data-onchange="modelFields">
      ${[['retainer','Retainer'],['fixed','Fixed scope'],['tm','T&M'],['equity','Equity']].map(([v,l],i)=>`<button class="chip ${i===0?'on':''}" data-v="${v}">${l}</button>`).join('')}</div></div>
    <div id="modelFields"></div>
    <div class="two">
      <div><label class="f-lab">Starts</label><input class="inp" id="f_start" type="date" value="2026-09-01"></div>
      <div><label class="f-lab">Ends</label><input class="inp" id="f_end" type="date"></div></div>
    <div><label class="f-lab">Status</label><select class="inp" id="f_status">
      ${['Active','Pending','Proposed','Held','Delivered'].map(s=>`<option>${s}</option>`).join('')}</select></div>
    <div class="meta">Leave the end date empty for rolling work.</div>`},
};
const MODEL_FIELDS={
  retainer:`<div class="two"><div><label class="f-lab">Monthly rate</label><input class="inp" id="f_rate" placeholder="1800"></div>
    <div><label class="f-lab">Hours included</label><input class="inp" id="f_hours" placeholder="12"></div></div>`,
  fixed:`<div class="two"><div><label class="f-lab">Contract value</label><input class="inp" id="f_value" placeholder="28500"></div>
    <div><label class="f-lab">Milestones</label><input class="inp" id="f_total" placeholder="4"></div></div>`,
  tm:`<div class="two"><div><label class="f-lab">Hourly rate</label><input class="inp" id="f_hourly" placeholder="165"></div>
    <div><label class="f-lab">Estimated hours</label><input class="inp" id="f_hoursEst" placeholder="30"></div></div>`,
  equity:`<div><label class="f-lab">Position</label><input class="inp" id="f_note" placeholder="5% · 83(b) filed"></div>`,
};
function syncClient(){const b=$('#f_biller').value;if($('#f_client')&&!$('#f_client').dataset.touched)$('#f_client').value=b;}
let editing=null;
function openForm(type,coId){
  $('#newMenu').classList.remove('open');
  editing=null;$('#formSave').textContent='Create';
  formType=type;const f=FORMS[type];
  $('#formTitle').textContent=f.title;$('#formKind').textContent=f.note;$('#formNote').textContent='saved locally';
  $('#formBody').innerHTML=f.fields;form={};
  document.querySelectorAll('#formBody [data-chip]').forEach(g=>{
    form[g.dataset.chip]=g.querySelector('.chip.on').dataset.v;
    g.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{
      form[g.dataset.chip]=b.dataset.v;
      g.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));
      if(g.dataset.chip==='bills')$('#viaWrap').style.display=b.dataset.v==='via'?'block':'none';
      if(g.dataset.chip==='model')$('#modelFields').innerHTML=MODEL_FIELDS[b.dataset.v]||'';
    }));
  });
  if(type==='engagement')$('#modelFields').innerHTML=MODEL_FIELDS.retainer;
  if($('#f_client'))$('#f_client').addEventListener('change',e=>e.target.dataset.touched=1);
  if(type==='service'&&coId){
    const s=svcOf(coId); editing=coId;
    $('#formTitle').textContent='Edit — '+s.name;
    $('#f_name').value=s.name;$('#f_blurb').value=s.blurb;$('#f_cat').value=s.cat;
    const cur=s.versions[s.versions.length-1];$('#f_rate').value=cur.rate;$('#f_from').value=cur.from;
    document.querySelectorAll('#formBody [data-chip="stype"] .chip').forEach(b=>b.classList.toggle('on',b.dataset.v===s.type));
    document.querySelectorAll('#formBody [data-chip="sunit"] .chip').forEach(b=>b.classList.toggle('on',b.dataset.v===s.unit));
    form.stype=s.type;form.sunit=s.unit;
    $('#formSave').textContent='Save';
  } else if(coId){ if($('#f_co'))$('#f_co').value=coId;
    if($('#f_biller')){const c=co(coId); $('#f_biller').value=c.bills?coId:(c.via||coId); $('#f_client').value=coId;} }
  $('#formScrim').classList.add('open');
  setTimeout(()=>$('#f_name')?.focus(),50);
}
function closeForm(){$('#formScrim').classList.remove('open');}
$('#formSave').addEventListener('click',()=>{
  if(formType==='price'){
    const s=svcOf(priceTarget),cur=s.versions[s.versions.length-1];
    const r=+($('#f_rate').value.replace(/[^0-9]/g,'')||0);
    if(!r){$('#f_rate').focus();toast('Enter a price');return;}
    const from=$('#f_from').value||'2026-09-01';
    cur.to=from; s.versions.push({v:cur.v+1,rate:r,from,to:null});
    closeForm();toast(`<b>${esc(s.name)}</b> now v${cur.v+1}`);go('services');return;
  }
  const name=$('#f_name').value.trim();
  if(!name){$('#f_name').focus();toast('Give it a name');return;}
  const id='n'+Date.now();
  if(formType==='company'){
    const viaSel=form.bills==='via'?$('#f_via').value:null;
    companies.unshift({id,name,kind:form.kind,cadence:+form.cadence,lastTouch:'2026-08-27',since:'2026-08',
      site:$('#f_site').value||'—',bills:form.bills==='direct',via:viaSel,budget:$('#f_budget').value||'',note:'',links:[]});
    closeForm();toast(`<b>${esc(name)}</b> added`);go('company',id);
  } else if(formType==='person'){
    const c=$('#f_co').value;
    people.unshift({id,name,title:$('#f_title').value||'—',co:c||null,email:$('#f_email').value||'—',last:'2026-08-27',tag:form.tag});
    closeForm();toast(`<b>${esc(name)}</b> added`);go('person',id);
  } else if(formType==='service'){
    const u=form.sunit, model=u==='mo'?'retainer':u==='hr'?'tm':'fixed';
    const rate=+($('#f_rate').value.replace(/[^0-9]/g,'')||0), from=$('#f_from').value||'2026-09-01';
    if(editing){
      const s=svcOf(editing);
      Object.assign(s,{name,type:form.stype,cat:$('#f_cat').value,model,unit:u,blurb:$('#f_blurb').value||''});
      const cur=s.versions[s.versions.length-1];
      if(rate&&rate!==cur.rate){cur.to=from;s.versions.push({v:cur.v+1,rate,from,to:null});}
      closeForm();toast(`<b>${esc(name)}</b> saved`);go('services');
    } else {
      services.push({id,name,type:form.stype,cat:$('#f_cat').value,model,unit:u,active:true,
        blurb:$('#f_blurb').value||'',versions:[{v:1,rate,from,to:null}]});
      closeForm();toast(`<b>${esc(name)}</b> added`);go('services');
    }
  } else if(formType==='todo'){
    const c=$('#f_co').value;
    todos.unshift({id,title:name,co:c||null,eng:null,due:$('#f_due').value||null,
      status:form.state,since:form.state==='waiting'?'2026-08-27':null,next:form.next==='1'});
    closeForm();toast(`Todo added`);go(c?'company':'todos',c||undefined);
  } else {
    const biller=$('#f_biller').value,client=$('#f_client').value,m=form.model;
    const e={id,biller,client,name,model:m,status:$('#f_status').value,ytd:0,
      start:$('#f_start').value||'2026-09-01',end:$('#f_end').value||null};
    if(m==='retainer'){e.rate=+($('#f_rate').value||0);e.hoursIncl=+($('#f_hours').value||10);e.hoursUsed=0;e.months=1;}
    if(m==='fixed'){e.value=+($('#f_value').value.replace(/[^0-9]/g,'')||0);e.total=+($('#f_total').value||3);e.done=0;
      e.milestones=Array.from({length:e.total},(_,i)=>'Milestone '+(i+1));}
    if(m==='tm'){e.hourly=+($('#f_hourly').value||150);e.hoursEst=+($('#f_hoursEst').value||20);e.hoursUsed=0;}
    if(m==='equity')e.note=$('#f_note').value||'—';
    engagements.unshift(e);
    closeForm();toast(`<b>${esc(name)}</b> added`);go('company',biller);
  }
  refreshCounts();
});

/* ══ log ══ */
let logKind='Call';
function openLog(coId){
  $('#newMenu').classList.remove('open');
  $('#logWho').innerHTML=companies.map(c=>`<option value="${c.id}" ${c.id===coId?'selected':''}>${esc(c.name)}${c.via?' (via '+esc(co(c.via).name)+')':''}</option>`).join('');
  $('#logKinds').innerHTML=['Call','Email','Meeting','Note'].map(k=>`<button class="chip ${k===logKind?'on':''}" data-k="${k}">${k}</button>`).join('');
  document.querySelectorAll('#logKinds .chip').forEach(b=>b.addEventListener('click',()=>{
    logKind=b.dataset.k;document.querySelectorAll('#logKinds .chip').forEach(x=>x.classList.toggle('on',x.dataset.k===logKind));}));
  $('#logNote').value='';$('#logScrim').classList.add('open');
  setTimeout(()=>$('#logNote').focus(),50);
}
function closeLog(){$('#logScrim').classList.remove('open');}
function saveLog(){
  const id=$('#logWho').value,note=$('#logNote').value.trim();
  if(!note){$('#logNote').focus();toast('Write one line first');return;}
  const c=co(id);
  activity.unshift({id:'a'+Date.now(),co:id,kind:logKind,date:'2026-08-27',title:logKind,note});
  c.lastTouch='2026-08-27';closeLog();
  toast(`Logged. <b>${esc(c.name)}</b> is current.`);go(cur,curArg);
}

/* ══ palette ══ */
let palItems=[],palSel=0;
function buildPal(q){
  const s=q.trim().toLowerCase(),out=[];
  [['Company',()=>openForm('company')],['Person',()=>openForm('person')],['Engagement',()=>openForm('engagement')],['Todo',()=>openForm('todo')],['Service or product',()=>openForm('service')],['Touch',()=>openLog()]]
    .filter(([n])=>!s||('new '+n).toLowerCase().includes(s))
    .forEach(([n,fn])=>out.push({ki:'CREATE',tx:'New '+n.toLowerCase(),hint:'',run:()=>{closePalette();fn();}}));
  companies.filter(c=>!s||c.name.toLowerCase().includes(s)).forEach(c=>out.push({ki:c.via?'END CLI':'COMPANY',tx:c.name,
    hint:c.via?'via '+co(c.via).name:decay(c).label,run:()=>{closePalette();go('company',c.id);}}));
  people.filter(p=>!s||p.name.toLowerCase().includes(s)||p.title.toLowerCase().includes(s))
    .forEach(p=>out.push({ki:'PERSON',tx:p.name,hint:p.co?co(p.co).name:'',run:()=>{closePalette();go('person',p.id);}}));
  engagements.filter(e=>!s||e.name.toLowerCase().includes(s))
    .forEach(e=>out.push({ki:'ENGMT',tx:e.name,hint:headline(e),run:()=>{closePalette();go('company',e.biller);}}));
  services.filter(x=>s&&x.name.toLowerCase().includes(s))
    .forEach(x=>out.push({ki:'SERVICE',tx:x.name,hint:fmtRate(x,listRate(x)),run:()=>{closePalette();go('services');}}));
  todos.filter(t=>!s?t.next&&t.status!=='done':t.title.toLowerCase().includes(s))
    .forEach(t=>out.push({ki:'TODO',tx:t.title,hint:dueInfo(t).label,run:()=>{closePalette();go(t.co?'company':'todos',t.co||undefined);}}));
  activity.filter(a=>s&&(a.title.toLowerCase().includes(s)||a.note.toLowerCase().includes(s)))
    .forEach(a=>out.push({ki:'NOTE',tx:a.note.slice(0,52),hint:fmtDate(a.date),run:()=>{closePalette();go('company',a.co);}}));
  palItems=out.slice(0,12);palSel=0;renderPal();
}
function renderPal(){
  if(!palItems.length){$('#palList').innerHTML=`<div class="empty">No match.</div>`;return;}
  $('#palList').innerHTML=palItems.map((i,n)=>`<button class="pal-i ${n===palSel?'sel':''}" data-n="${n}">
    <span class="ki">${i.ki}</span><span class="tx trunc">${esc(i.tx)}</span><span class="hint">${esc(i.hint||'')}</span></button>`).join('');
  document.querySelectorAll('.pal-i').forEach(b=>b.addEventListener('click',()=>palItems[+b.dataset.n].run()));
}
function openPalette(){$('#palScrim').classList.add('open');$('#palInput').value='';buildPal('');setTimeout(()=>$('#palInput').focus(),50);}
function closePalette(){$('#palScrim').classList.remove('open');}
$('#palInput').addEventListener('input',e=>buildPal(e.target.value));
$('#palInput').addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault();palSel=(palSel+1)%palItems.length;renderPal();}
  if(e.key==='ArrowUp'){e.preventDefault();palSel=(palSel-1+palItems.length)%palItems.length;renderPal();}
  if(e.key==='Enter'&&palItems[palSel])palItems[palSel].run();
});

function toast(html){const t=$('#toast');t.innerHTML=html;t.classList.add('show');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('show'),2500);}
function refreshCounts(){
  $('#c-co').textContent=companies.length;$('#c-pe').textContent=people.length;
  $('#c-en').textContent=engagements.length;$('#c-td').textContent=openTodos().length;$('#c-pipe').textContent=pipeline.reduce((n,c)=>n+c.items.length,0);
}
document.addEventListener('keydown',e=>{
  const mod=e.metaKey||e.ctrlKey;
  if(mod&&e.key==='k'){e.preventDefault();openPalette();}
  if(mod&&e.key==='l'){e.preventDefault();openLog();}
  if(e.key==='Escape'){closePalette();closeLog();closeForm();$('#newMenu').classList.remove('open');}
});
refreshCounts();go('today');

</script>
